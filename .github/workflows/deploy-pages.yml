name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Check desktop and mobile journeys
        run: npm run test:e2e

      - name: Save browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Publish verified stable version
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Create release and remove completed work branches
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (!/^\d+\.\d+\.\d+$/.test(version)) {
              core.info('Prerelease version, no stable release created.');
              return;
            }
            const tag = `v${version}`;
            const repo = context.repo;
            try {
              await github.rest.repos.getReleaseByTag({ ...repo, tag });
              core.info(`${tag} already released; preserving its tag and notes.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            // Never move an existing tag to a different revision.
            try {
              const { data: ref } = await github.rest.git.getRef({ ...repo, ref: `tags/${tag}` });
              if (ref.object.type !== 'commit' || ref.object.sha !== context.sha) {
                throw new Error(`${tag} already exists at another object. Manual review required.`);
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const notes = fs.readFileSync('CHANGELOG.md', 'utf8');
            const section = notes.split(`## ${version}\n`)[1]?.split('\n## ')[0]?.trim();
            if (!section) throw new Error(`Missing release notes for ${version}`);
            const { data: release } = await github.rest.repos.createRelease({
              ...repo, tag_name: tag, target_commitish: context.sha,
              name: `Week Planner ${version}`, body: section,
              draft: false, prerelease: false,
            });
            core.info(`Published ${release.html_url} at ${context.sha}`);

            // Only these completed branches are eligible. A new commit after
            // the merged PR makes a branch ineligible, including squash merges.
            const candidates = ['feat/finish-web-planner', 'codex/add-responsive-three-day-planner-view', 'release/1.0.0'];
            for (const branch of candidates) {
              try {
                const { data: ref } = await github.rest.git.getRef({ ...repo, ref: `heads/${branch}` });
                const { data: prs } = await github.rest.pulls.list({ ...repo, state: 'closed', base: 'main', head: `${repo.owner}:${branch}` });
                if (!prs.some(pr => pr.merged_at && pr.head.sha === ref.object.sha)) {
                  core.info(`Retaining ${branch}: its current head is not covered by a merged PR.`);
                  continue;
                }
                const { data: latest } = await github.rest.git.getRef({ ...repo, ref: `heads/${branch}` });
                if (latest.object.sha !== ref.object.sha) continue;
                await github.rest.git.deleteRef({ ...repo, ref: `heads/${branch}` });
                core.info(`Removed merged branch ${branch}`);
              } catch (error) {
                if (error.status !== 404) core.warning(`Could not clean up ${branch}: ${error.message}`);
              }
            }
