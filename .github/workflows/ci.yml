name: Pull request quality gates

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality-gates:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build production bundle
        run: npm run build

      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Check desktop and mobile journeys
        run: npm run test:e2e

      - name: Save browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
